<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala de Ministérios - IIGD Jacobina</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="church" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">IIGD Jacobina</h1>
                    <p class="text-xs text-slate-400">Escalas & Gestão de Cultos</p>
                </div>
            </div>
            <!-- Notification Toggle Badge -->
            <button id="btn-notify-permission" onclick="requestNotificationPermission()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                <i data-lucide="bell" class="w-4 h-4 text-indigo-400"></i>
                <span id="notify-status-text">Ativar Avisos</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">

        <!-- User Identification Card -->
        <section class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-xl">
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
                <div class="w-full sm:w-1/2 relative">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Seu Nome Completo</label>
                    <div class="relative">
                        <input type="text" id="user-name" placeholder="Digite seu nome..." oninput="handleNameInput()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 pl-10 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                        <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3 top-3"></i>
                    </div>
                </div>

                <div class="w-full sm:w-1/2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Acesso / Perfil</label>
                    <select id="user-role" onchange="handleRoleChange()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                        <option value="Obreiro">Obreiro</option>
                        <option value="Tia">Tia (Infantil)</option>
                        <option value="Líder">Líder de Departamento</option>
                        <option value="Ministro de Louvor">Ministro de Louvor</option>
                        <option value="Pastor">Pastor (Visão Geral)</option>
                    </select>
                </div>
            </div>

            <!-- Auto-recognized scales container -->
            <div id="user-quick-schedules" class="mt-4 pt-4 border-t border-slate-700/60 hidden">
                <div class="flex items-center gap-2 text-indigo-400 text-xs font-semibold mb-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    <span>Sua Escala Reconhecida:</span>
                </div>
                <div id="quick-schedules-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs"></div>
            </div>
        </section>

        <!-- Role Banner / Dynamic Actions -->
        <div id="role-banner" class="bg-gradient-to-r from-indigo-900/50 to-slate-800 border border-indigo-500/30 rounded-xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="role-icon" class="p-2 bg-indigo-500/20 text-indigo-300 rounded-lg">
                    <i data-lucide="shield" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 id="role-title" class="font-semibold text-white">Visualização de Membro</h2>
                    <p id="role-desc" class="text-xs text-slate-400">Consulte suas escalas e confirme sua presença nos cultos.</p>
                </div>
            </div>
            <button onclick="testNotification()" class="text-xs bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 border border-indigo-500/40 px-3 py-1.5 rounded-lg transition">Testar Notificação</button>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="flex border-b border-slate-800 space-x-2 overflow-x-auto pb-1" id="main-tabs">
            <button onclick="switchTab('escalas')" id="tab-escalas" class="tab-btn bg-slate-800 text-indigo-400 px-4 py-2 rounded-t-xl font-medium text-sm border-t border-x border-slate-700 flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="calendar" class="w-4 h-4"></i> Escalas dos Cultos
            </button>
            <button onclick="switchTab('lider')" id="tab-lider" class="tab-btn bg-slate-900/50 text-slate-400 hover:text-slate-200 px-4 py-2 rounded-t-xl font-medium text-sm flex items-center gap-2 whitespace-nowrap hidden">
                <i data-lucide="users" class="w-4 h-4"></i> Gestão do Líder
            </button>
            <button onclick="switchTab('pastor')" id="tab-pastor" class="tab-btn bg-slate-900/50 text-slate-400 hover:text-slate-200 px-4 py-2 rounded-t-xl font-medium text-sm flex items-center gap-2 whitespace-nowrap hidden">
                <i data-lucide="eye" class="w-4 h-4"></i> Painel do Pastor
            </button>
            <button onclick="switchTab('repertorio')" id="tab-repertorio" class="tab-btn bg-slate-900/50 text-slate-400 hover:text-slate-200 px-4 py-2 rounded-t-xl font-medium text-sm flex items-center gap-2 whitespace-nowrap">
                <i data-lucide="music" class="w-4 h-4"></i> Repertório de Louvor
            </button>
        </div>

        <!-- SECTION 1: ESCALAS DOS CULTOS -->
        <section id="sec-escalas" class="space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-200 text-sm flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4 text-indigo-400"></i> Programação Semanal
                </h3>
                <span class="text-xs text-slate-500">IIGD Jacobina</span>
            </div>

            <!-- Schedule Cards Grid -->
            <div id="schedule-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamic schedule cards will render here -->
            </div>
        </section>

        <!-- SECTION 2: PAINEL DO LÍDER (Gestão de Liderados e Escala) -->
        <section id="sec-lider" class="space-y-6 hidden">
            <!-- Cadastro de Liderados -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-4">
                <h3 class="font-bold text-white text-sm flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-4 h-4 text-indigo-400"></i> Cadastrar Novo Liderado
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="new-member-name" placeholder="Nome do Membro..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <select id="new-member-role" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="Obreiro">Obreiro</option>
                        <option value="Tia">Tia (Infantil)</option>
                        <option value="Ministro de Louvor">Ministro de Louvor</option>
                    </select>
                    <button onclick="addMember()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> Cadastrar
                    </button>
                </div>
            </div>

            <!-- Criar/Vincular Escala -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-4">
                <h3 class="font-bold text-white text-sm flex items-center gap-2">
                    <i data-lucide="calendar-plus" class="w-4 h-4 text-emerald-400"></i> Escalar Liderado para o Culto
                </h3>
                <div
